<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b1a10" />
<title>Canvas Soccer</title>
<!-- data: favicon keeps the browser from issuing a 404 request for /favicon.ico -->
<link rel="icon" href="data:," />
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b1a10; color: #fff;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #app { position: fixed; inset: 0; }
  #view { display: block; width: 100%; height: 100%; }
  #hud  { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #boot {
    position: fixed; inset: 0; z-index: 50; display: flex;
    align-items: center; justify-content: center; letter-spacing: .32em;
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    color: #cfe9d2; background: #0b1a10; transition: opacity .45s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
</style>
<!--
  three.js r160 is vendored under vendor/three/ as plain ES-module text so the game
  runs with zero network access (and so the repo stays binary-free). The paths below
  mirror https://unpkg.com/three@0.160.0/{build,examples/jsm}/ exactly.
-->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="boot">Loading Pitch</div>
  </div>
  <script type="module">
    import { boot } from './src/main.js';
    boot({
      canvas: document.getElementById('view'),
      hudRoot: document.getElementById('hud'),
      splash: document.getElementById('boot'),
    });
  </script>
</body>
</html>
